/cleaning_task_manager:
  ros__parameters:
    adjust_blocked_gap_goals: true
    checkpoint_dir: /home/xbs/.ros/sweeper_checkpoints
    cleaning_radius: 0.2
    coverage_completion_margin: 0.01
    defer_blocked_sweep_goals: true
    early_gap_replan: true
    gap_behavior_tree: /tmp/sweeper-gap-bt-k9zhfnwe/navigate_gap.xml
    gap_failure_replan_threshold: 0
    gap_navigation_retries: 1
    gap_progress_timeout_s: 35
    max_gap_passes: 3
    navigation_retries: 1
    navigation_timeout_s: 90
    progress_timeout_s: 35
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        subscription:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        subscription:
          depth: 100
          history: keep_last
          reliability: reliable
    region_names: []
    start_type_description_service: true
    target_path_efficiency: 0.8
    use_coverage_planner: true
    use_sim_time: true

